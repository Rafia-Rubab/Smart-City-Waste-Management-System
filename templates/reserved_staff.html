{% extends 'base.html' %}{% block content %}<h2>Reserved Staff Management</h2><div class="card"><h3>Add Reserved Staff</h3><form method="POST" class="grid"><div><label>Staff Member</label><select name="staff_id">{% for s in staff %}<option value="{{s.staff_id}}">{{s.full_name}}</option>{% endfor %}</select></div><div><label>Availability Date</label><input type="date" name="availability_date" required></div><div><label>Occasion Type</label><select name="occasion_type"><option>Festival</option><option>Public Holiday</option><option>Natural Disaster</option><option>Emergency</option></select></div><div style="padding-top:28px"><button>Add Reserved Staff</button></div></form></div><div class="card"><table><thead><tr><th>ID</th><th>Staff</th><th>Availability Date</th><th>Occasion Type</th></tr></thead><tbody>{% for r in records %}<tr><td>{{r.reserved_id}}</td><td>{{r.full_name}}</td><td>{{r.availability_date}}</td><td>{{r.occasion_type}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
