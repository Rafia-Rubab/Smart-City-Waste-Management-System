{% extends 'base.html' %}{% block content %}<h2>Area Management</h2><div class="card"><h3>Add Area</h3><form method="POST" class="grid"><div><label>Area Name</label><input name="area_name" required></div><div><label>City Zone</label><input name="city_zone"></div><div><label>Postal Code</label><input name="postal_code"></div><div style="padding-top:28px"><button>Add Area</button></div></form></div><div class="card"><table><thead><tr><th>ID</th><th>Area</th><th>Zone</th><th>Postal Code</th><th>Action</th></tr></thead><tbody>{% for a in areas %}<tr><td>{{a.area_id}}</td><td>{{a.area_name}}</td><td>{{a.city_zone}}</td><td>{{a.postal_code}}</td><td><form method="POST" action="/areas/{{a.area_id}}/delete"><button class="danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
