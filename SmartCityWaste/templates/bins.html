{% extends 'base.html' %}{% block content %}<h2>Waste Bin Management</h2><div class="card"><h3>Add Waste Bin</h3><form method="POST" class="grid"><div><label>Area</label><select name="area_id" required>{% for a in areas %}<option value="{{a.area_id}}">{{a.area_name}}</option>{% endfor %}</select></div><div><label>Location</label><input name="location" required></div><div><label>Fill Level (%)</label><input type="number" min="0" max="100" step="0.1" name="fill_level" value="0"></div><div><label>Waste Type</label><select name="waste_type"><option>Organic</option><option>Plastic</option><option>Hazardous</option></select></div><div><button>Add Bin</button></div></form></div><div class="card"><table><thead><tr><th>ID</th><th>Area</th><th>Location</th><th>Fill Level</th><th>Type</th><th>Update Fill</th></tr></thead><tbody>{% for b in bins %}<tr><td>{{b.bin_id}}</td><td>{{b.area_name}}</td><td>{{b.location}}</td><td><span class="{% if b.fill_level>80 %}over{% endif %}">{{b.fill_level}}%</span></td><td>{{b.waste_type}}</td><td><form method="POST" action="/bins/{{b.bin_id}}/update"><input type="number" name="fill_level" value="{{b.fill_level}}" style="width:90px;display:inline-block"> <button>Save</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
